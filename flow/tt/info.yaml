# Tiny Tapeout project information
project:
  title:        "2x2 int8 MAC array (byte-serial)"
  author:       "Noah Sabb"
  discord:      ""
  description:  "Output-stationary 2x2 array of signed int8 multiply-accumulators with 32-bit accumulators, loaded and read one byte at a time over ui_in/uio_in."
  language:     "Verilog"
  clock_hz:     50000000
  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_noahsabb_mac"
  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  source_files:
    - "project.v"
    - "mac_array_2x2.v"
    - "mac_int8.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "data[0]"
  ui[1]: "data[1]"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "data[6]"
  ui[7]: "data[7]"

  # Outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins
  uio[0]: "strobe (input)"
  uio[1]: "cmd[0] (input)"
  uio[2]: "cmd[1] (input)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
